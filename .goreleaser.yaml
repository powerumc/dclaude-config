version: 2

project_name: dclaude

builds:
  - id: dclaude
    main: ./cmd/dclaude
    binary: dclaude
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{.Version}}

  - id: dclaude-code
    main: ./cmd/dclaude-code
    binary: dclaude-code
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, README.ko.md]

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
